# 3D-Drucker-Portal – Nginx Konfiguration
# LAN-IP: 172.17.129.228 | Tailscale: 100.106.23.2 (nicht anfassen)

server {
    listen 172.17.129.228:80;
    listen 100.106.23.2:80;
    server_name 172.17.129.228 100.106.23.2;
    return 301 https://$host$request_uri;
}

server {
    listen 172.17.129.228:443 ssl;
    listen 100.106.23.2:443 ssl;
    server_name 172.17.129.228 100.106.23.2;

    ssl_certificate     /etc/nginx/ssl/drucker-portal.crt;
    ssl_certificate_key /etc/nginx/ssl/drucker-portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Datei-Upload bis 500MB (G-Code Dateien)
    client_max_body_size 500M;

    # Backend API
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # OctoPrint API (Weiterleitung für Webcam etc.)
    location /octoprint/ {
        proxy_pass         http://127.0.0.1:5000/;
        proxy_set_header   Host $host;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # K2 Webcam – MJPEG via FastAPI (/api/printers/k2/webcam → proxy oben abgedeckt)

    # CR-X Pro – Webcam MJPEG via Frigate go2rtc
    location /printers/crx/webcam {
        proxy_pass         http://127.0.0.1:1984/api/stream.mjpeg?src=webcam_1;
        proxy_buffering    off;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 300s;
    }

    # Frontend (React Build)
    location / {
        root       /home/jf/3d-drucker-portal/frontend/dist;
        try_files  $uri $uri/ /index.html;
        expires    1h;
    }
}
